name: Build Pebble app

# Builds the .pbw on every push / PR and uploads it as a downloadable artifact,
# so you can install Lern Deutsch without setting up the SDK locally. The Chinese
# glyph atlases are committed, so the build needs nothing beyond the Pebble SDK.
#
# Pushing a version tag (v*) additionally publishes a GitHub Release with the
# compiled .pbw attached — that's the download the README points learners at
# (release assets need no GitHub login, unlike Actions artifacts). To backfill
# a release for an existing tag, run this workflow manually with the tag name.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to build and publish a release for (optional)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the release step attach the .pbw to a release
    steps:
      - uses: actions/checkout@v4
        with:
          # for a manual backfill, build the tag's source, not the branch head
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fail fast on word-list mistakes (wrong gender/article, oversize decks,
      # characters the renderer can't draw) before spending minutes on the SDK.
      - name: Validate vocabulary
        run: python3 tools/validate_vocab.py

      - name: Install pebble-tool
        run: |
          python3 -m venv "$HOME/pebble-venv"
          "$HOME/pebble-venv/bin/pip" install --upgrade pip setuptools wheel
          "$HOME/pebble-venv/bin/pip" install pebble-tool
          echo "$HOME/pebble-venv/bin" >> "$GITHUB_PATH"

      - name: Install Pebble SDK
        run: yes | pebble sdk install latest

      - name: Build
        run: pebble build

      - name: Upload .pbw
        uses: actions/upload-artifact@v4
        with:
          name: LernDeutsch-pbw
          path: build/*.pbw
          if-no-files-found: error

      # Version tags become real releases carrying the compiled app, so the
      # Releases page offers more than GitHub's automatic source archives.
      - name: Publish the .pbw on the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          cp build/*.pbw "LernDeutsch-${TAG}.pbw"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "Lern Deutsch $TAG" --generate-notes
          gh release upload "$TAG" "LernDeutsch-${TAG}.pbw" --clobber
